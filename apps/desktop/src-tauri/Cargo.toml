[package]
name = "roost_deck"
version = "0.1.0"
description = "The Roost Command Deck — Desktop Host Engine"
authors = ["Taha Asadullah <The Foolish Crow>"]
edition = "2021"

[lib]
name = "roost_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
